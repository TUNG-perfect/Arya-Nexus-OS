<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARYA NEXUS OS</title>
<style>
:root{--accent:#36bdf8;--glass:rgba(12,24,42,.88);--line:rgba(255,255,255,.15)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:#07111f;color:#edf6ff;overflow:hidden}
button,input,textarea{font:inherit}button{cursor:pointer;color:inherit}
#desktop{height:100vh;min-height:500px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 72% 22%,#164f72 0,transparent 40%),radial-gradient(ellipse at 15% 90%,#38265e 0,transparent 42%),linear-gradient(135deg,#081525,#111d35 65%,#07101d)}
#grid{position:absolute;inset:0;opacity:.2;background-image:linear-gradient(#8bd7ff12 1px,transparent 1px),linear-gradient(90deg,#8bd7ff12 1px,transparent 1px);background-size:42px 42px;pointer-events:none}
#topbar{height:34px;position:absolute;z-index:1000;top:0;left:0;right:0;background:#07111ccc;backdrop-filter:blur(16px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:11px}
.brand{font-weight:850;letter-spacing:1.5px;color:#8bdcff}
#icons{position:absolute;top:52px;left:12px;display:grid;grid-template-columns:repeat(2,78px);gap:10px}
.deskicon{border:1px solid transparent;background:transparent;border-radius:10px;padding:9px 3px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;text-shadow:0 2px 5px #000}
.deskicon:hover{background:#ffffff1b;border-color:#ffffff20}.deskicon span{font-size:29px}
#widget{position:absolute;right:18px;top:55px;width:190px;padding:14px;border:1px solid var(--line);border-radius:15px;background:#10243caa;backdrop-filter:blur(14px)}
.muted{color:#9eb2cc;font-size:10px}.bigtime{font-size:27px;font-weight:750;margin:5px 0}
.meter{height:5px;border-radius:9px;background:#34445b;margin:6px 0 12px;overflow:hidden}.meter>div{height:100%;background:var(--accent);width:30%}
#dock{position:absolute;z-index:1000;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:7px;padding:8px;background:#101d2ee8;border:1px solid var(--line);border-radius:17px;backdrop-filter:blur(18px);box-shadow:0 10px 35px #0008}
#dock button{width:42px;height:42px;border:1px solid #ffffff14;border-radius:12px;background:#ffffff0c;font-size:20px}#dock button:hover{transform:translateY(-4px);background:#ffffff28}
#startmenu{display:none;position:absolute;z-index:1100;bottom:72px;left:50%;transform:translateX(-50%);width:min(340px,92vw);padding:15px;background:#101e32f5;border:1px solid var(--line);border-radius:16px;box-shadow:0 15px 50px #0009;backdrop-filter:blur(20px)}
.appgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.appgrid button{border:1px solid #ffffff13;border-radius:10px;background:#ffffff0a;padding:12px 4px;font-size:11px}.appgrid button span{display:block;font-size:24px;margin-bottom:5px}.appgrid button:hover{background:#ffffff20}
.window{position:absolute;z-index:10;left:50%;top:90px;transform:translateX(-50%);width:min(560px,94vw);height:min(410px,72vh);min-height:240px;display:flex;flex-direction:column;background:#101c2df5;border:1px solid #ffffff30;border-radius:13px;box-shadow:0 20px 65px #0009;overflow:hidden}
.winhead{height:40px;min-height:40px;background:#1a2b42;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:12px;cursor:move;user-select:none;border-bottom:1px solid #ffffff15}
.winhead button{border:0;border-radius:6px;background:#d95763;padding:4px 10px}.winbody{padding:14px;overflow:auto;flex:1;font-size:13px}
.btn{background:#20547b;border:1px solid #ffffff20;border-radius:7px;padding:7px 11px}.btn:hover{background:#2c709e}
.field{background:#071321;color:#edf6ff;border:1px solid #3a526e;border-radius:7px;padding:9px;outline:none;width:100%}.field:focus{border-color:var(--accent)}
.tile{background:#192b42;border:1px solid #ffffff12;border-radius:10px;padding:12px}
.file-row{display:flex;align-items:center;justify-content:space-between;padding:10px;border-bottom:1px solid #ffffff13}
.term{background:#030a10;color:#75e6a5;border-radius:9px;padding:12px;font:12px/1.6 ui-monospace,monospace;min-height:220px;overflow:auto;white-space:pre-wrap}
#boot{position:absolute;z-index:2000;inset:0;background:#050b16;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center}
.bootlogo{font-size:40px;font-weight:900;letter-spacing:7px;background:linear-gradient(90deg,#70dcff,#a58aff);color:transparent;background-clip:text}
.bootbar{width:190px;height:4px;background:#26364a;border-radius:8px;margin-top:28px;overflow:hidden}.bootbar div{height:100%;width:0;background:#62d8ff;transition:width .35s}
#boot button{margin-top:22px;display:none}
@media(max-width:600px){#widget{width:145px;right:8px;top:52px;padding:9px}#icons{grid-template-columns:repeat(2,65px);left:4px}.window{top:75px;height:65vh}.deskicon{font-size:10px}}
</style>
</head>
<body>
<div id="desktop">
<div id="grid"></div>
<div id="topbar"><span class="brand">◆ ARYA NEXUS</span><span>WEB EDITION　·　<span id="clock">--:--</span></span></div>
<div id="icons">
<button class="deskicon" data-app="files"><span>📁</span>Files</button>
<button class="deskicon" data-app="browser"><span>🌐</span>Internet</button>
<button class="deskicon" data-app="terminal"><span>⌨️</span>Terminal</button>
<button class="deskicon" data-app="computer"><span>🖥️</span>Computer</button>
<button class="deskicon" data-app="calculator"><span>🧮</span>Calculator</button>
<button class="deskicon" data-app="settings"><span>⚙️</span>Settings</button>
</div>
<div id="widget"><div class="muted">SYSTEM OVERVIEW</div><div class="bigtime" id="widgettime">--:--</div><div class="muted" id="date"></div><hr style="border-color:#ffffff20;margin:12px 0"><div class="muted">CPU LOAD · SIMULATED</div><div class="meter"><div id="cpu"></div></div><div class="muted">MEMORY · SIMULATED</div><div class="meter"><div id="ram"></div></div><div style="color:#72dfb0;font-size:10px">● System operational</div></div>
<div id="windows"></div>
<div id="startmenu"><div style="font-size:20px;font-weight:850">◆ ARYA NEXUS</div><div class="muted">Your virtual workstation</div><div class="appgrid">
<button data-app="files"><span>📁</span>Files</button><button data-app="browser"><span>🌐</span>Internet</button><button data-app="terminal"><span>⌨️</span>Terminal</button><button data-app="calculator"><span>🧮</span>Calculator</button><button data-app="tasks"><span>📊</span>Task Manager</button><button data-app="settings"><span>⚙️</span>Settings</button></div></div>
<div id="dock"><button id="startbtn">◆</button><button data-app="files">📁</button><button data-app="browser">🌐</button><button data-app="terminal">⌨️</button><button data-app="calculator">🧮</button><button data-app="tasks">📊</button></div>
<div id="boot"><div class="bootlogo">ARYA</div><div style="letter-spacing:5px;color:#91a9c5;font-size:11px;margin-top:8px">N E X U S　 O S</div><div id="boottext" class="muted" style="margin-top:35px">INITIALIZING KERNEL...</div><div class="bootbar"><div id="bootfill"></div></div><button class="btn" id="bootgo">Launch Desktop →</button></div>
</div>
<script>
(()=>{
const $=s=>document.querySelector(s), winArea=$('#windows'), menu=$('#startmenu');
let z=20,files=JSON.parse(localStorage.getItem('nexus_files')||'["Welcome.txt","System.ini","Projects","Readme.md"]');
const apps={files:['📁','File Manager'],browser:['🌐','Nexus Internet'],terminal:['⌨️','Nexus Terminal'],computer:['🖥️','My Computer'],calculator:['🧮','Calculator'],settings:['⚙️','Settings'],tasks:['📊','Task Manager']};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function boot(){let i=0,steps=['INITIALIZING KERNEL...','LOADING SYSTEM SERVICES...','MOUNTING VIRTUAL FILE SYSTEM...','STARTING DESKTOP...','SYSTEM READY'];$('#bootgo').style.display='none';$('#bootfill').style.width='0';let t=setInterval(()=>{i++;$('#boottext').textContent=steps[i];$('#bootfill').style.width=(i*25)+'%';if(i===4){clearInterval(t);$('#bootgo').style.display='inline-block'}},400)}
boot();$('#bootgo').onclick=()=>{$('#boot').style.display='none';openApp('computer')};
function saveFiles(){localStorage.setItem('nexus_files',JSON.stringify(files))}
function openApp(app){
if(!apps[app])return;menu.style.display='none';
let el=document.createElement('section');el.className='window';el.style.zIndex=++z;
let body='';
if(app==='files')body=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><b>Home / Files</b><button class="btn" data-act="newfile">＋ New file</button></div><div id="filelist">${fileRows()}</div><p class="muted">Virtual storage · changes saved in this browser</p>`;
if(app==='browser')body=`<div style="display:flex;gap:7px"><input class="field" id="address" value="https://www.google.com" placeholder="https://example.com"><button class="btn" data-act="go">Open</button></div><div class="tile" style="margin-top:13px"><div style="font-size:22px;font-weight:800;color:#81d7ff">🌐 REAL INTERNET</div><p style="margin:10px 0">Open websites in a new tab using your actual browser.</p><div style="display:flex;gap:7px;flex-wrap:wrap">${['https://www.google.com','https://www.wikipedia.org','https://github.com','https://www.python.org'].map((u,i)=>`<button class="btn" data-url="${u}">${['Google','Wikipedia','GitHub','Python'][i]}</button>`).join('')}</div><p class="muted" style="margin-top:14px">Some websites block embedding inside other pages. This browser opens them in a real browser tab.</p></div>`;
if(app==='terminal')body=`<div class="term"><div id="termout">ARYA NEXUS TERMINAL [Version 2.0]\nType help to see commands.\n\n</div><div style="display:flex;gap:6px"><span>arya@nexus:~$</span><input id="command" style="flex:1;min-width:0;background:transparent;color:#75e6a5;border:0;outline:none" autocomplete="off"></div></div>`;
if(app==='computer')body=`<h2 style="color:#80d8ff">Welcome to Arya Nexus</h2><p class="muted">Your personal virtual workstation</p><div class="appgrid">${Object.entries(apps).map(([k,v])=>`<button data-launch="${k}"><span>${v[0]}</span>${v[1]}</button>`).join('')}</div><div class="tile" style="margin-top:14px">Kernel: Nexus Virtual Kernel 2.0<br>Architecture: Browser-based<br>Storage: Local virtual files</div>`;
if(app==='calculator')body=`<div id="calcdisplay" class="tile" style="font-size:28px;text-align:right;margin-bottom:10px">0</div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:7px">${['7','8','9','÷','4','5','6','×','1','2','3','−','C','0','.','+','='].map(k=>`<button class="btn" data-key="${k}" style="padding:13px">${k}</button>`).join('')}</div>`;
if(app==='settings')body=`<h3 style="font-size:18px">Personalization</h3><p style="margin:15px 0 8px">Accent color</p><div style="display:flex;gap:9px">${['#36bdf8','#a78bfa','#34d399','#fb923c'].map(c=>`<button data-color="${c}" style="width:35px;height:35px;border-radius:50%;background:${c};border:2px solid white"></button>`).join('')}</div><hr style="border-color:#ffffff20;margin:17px 0"><p>Arya Nexus OS 2.0</p><p class="muted">Web Edition · Browser simulator</p><button class="btn" data-act="restart">Restart OS</button>`;
if(app==='tasks')body=`<h3 style="font-size:18px;margin-bottom:12px">System Monitor</h3><div class="tile">CPU <b id="cpuval">--%</b><div class="meter"><div id="cpumeter"></div></div>Memory <b id="ramval">--%</b><div class="meter"><div id="rammeter"></div></div></div><h4 style="margin:15px 0 8px">Open applications</h4><div id="processes"></div><p class="muted">Usage statistics are simulated.</p>`;
el.innerHTML=`<div class="winhead"><span>${apps[app][0]}　${apps[app][1]}</span><button data-act="close">✕</button></div><div class="winbody">${body}</div>`;winArea.appendChild(el);
el.addEventListener('mousedown',()=>el.style.zIndex=++z);
el.querySelector('[data-act="close"]').onclick=()=>el.remove();
const head=el.querySelector('.winhead');head.addEventListener('pointerdown',e=>{if(e.target.tagName==='BUTTON')return;let rect=el.getBoundingClientRect(),sx=e.clientX,sy=e.clientY,ox=rect.left,oy=rect.top;head.setPointerCapture(e.pointerId);let move=ev=>{el.style.left=(ox+ev.clientX-sx+el.offsetWidth/2)+'px';el.style.top=Math.max(36,oy+ev.clientY-sy)+'px';el.style.transform='none'};let end=()=>{head.removeEventListener('pointermove',move);head.removeEventListener('pointerup',end)};head.addEventListener('pointermove',move);head.addEventListener('pointerup',end)});
el.addEventListener('click',e=>{
let b=e.target.closest('button');if(!b)return;
if(b.dataset.launch){openApp(b.dataset.launch);return}
if(b.dataset.url){window.open(b.dataset.url,'_blank','noopener');return}
if(b.dataset.color){document.documentElement.style.setProperty('--accent',b.dataset.color);return}
if(b.dataset.del!==undefined){files.splice(Number(b.dataset.del),1);saveFiles();el.querySelector('#filelist').innerHTML=fileRows();return}
if(b.dataset.key){calcKey(b.dataset.key);return}
if(b.dataset.act==='newfile'){let name=prompt('File name:','New File.txt');if(name&&name.trim()){files.push(name.trim());saveFiles();el.querySelector('#filelist').innerHTML=fileRows()}return}
if(b.dataset.act==='go'){let val=el.querySelector('#address').value.trim();if(!val)return;let url=/^https?:\/\//i.test(val)?val:'https://'+val;try{let u=new URL(url);if(!['http:','https:'].includes(u.protocol))throw 0;window.open(u.href,'_blank','noopener')}catch{alert('Please enter a valid web address.')}return}
if(b.dataset.act==='restart'){el.remove();$('#boot').style.display='flex';boot()}
});
function fileRows(){return files.map((f,i)=>`<div class="file-row"><span>📄 ${esc(f)}</span><button class="btn" data-del="${i}">Delete</button></div>`).join('')}
let expression='';
function calcKey(k){let d=el.querySelector('#calcdisplay');if(k==='C')expression='';else if(k==='='){try{let s=expression.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');if(!/^[0-9+\-*/(). ]+$/.test(s))throw 0;let tokens=s.match(/(?:\d+(?:\.\d*)?|\.\d+)|[()+\-*/]/g);if(!tokens||tokens.join('')!==s.replace(/\s/g,''))throw 0;let p=0;function atom(){let t=tokens[p++];if(t==='('){let v=sum();if(tokens[p++]!==')')throw 0;return v}if(t==='-')return -atom();if(t==='+')return atom();let n=Number(t);if(!Number.isFinite(n))throw 0;return n}function product(){let v=atom();while(tokens[p]==='*'||tokens[p]==='/'){let op=tokens[p++],n=atom();v=op==='*'?v*n:v/n}return v}function sum(){let v=product();while(tokens[p]==='+'||tokens[p]==='-'){let op=tokens[p++],n=product();v=op==='+'?v+n:v-n}return v}let result=sum();if(p!==tokens.length||!Number.isFinite(result))throw 0;expression=String(result)}catch{expression='Error'}}else expression+=k;d.textContent=expression||'0'}
let cmd=el.querySelector('#command');if(cmd)cmd.onkeydown=e=>{if(e.key!=='Enter')return;let c=cmd.value.trim(),out=el.querySelector('#termout'),result='';if(c==='help')result='help, ls, date, whoami, neofetch, clear, uptime, memory, open [app], echo [text]';else if(c==='ls')result=files.join('    ');else if(c==='date')result=new Date().toString();else if(c==='whoami')result='arya';else if(c==='neofetch')result='◆ ARYA NEXUS 2.0\nOS: Arya Nexus\nKernel: Virtual Kernel\nShell: Nexus Shell';else if(c==='uptime')result='System is running.';else if(c==='memory')result='Virtual RAM: 512 MB (simulated)';else if(c==='clear'){out.textContent='';cmd.value='';return}else if(c.startsWith('echo '))result=c.slice(5);else if(c.startsWith('open ')){let a=c.slice(5);if(apps[a]){openApp(a);result='Opening '+a}else result='Unknown application'}else if(c)result='Command not found: '+c;out.textContent+='arya@nexus:~$ '+c+'\n'+result+'\n';cmd.value='';};
if(app==='tasks'){let cpu=Math.floor(Math.random()*35+8),ram=Math.floor(Math.random()*30+25);el.querySelector('#cpuval').textContent=cpu+'%';el.querySelector('#cpumeter').style.width=cpu+'%';el.querySelector('#ramval').textContent=ram+'%';el.querySelector('#rammeter').style.width=ram+'%';el.querySelector('#processes').innerHTML=[...winArea.querySelectorAll('.window')].map(w=>`<div class="file-row">${esc(w.querySelector('.winhead span').textContent)}</div>`).join('')}
}
document.querySelectorAll('[data-app]').forEach(b=>b.addEventListener('click',()=>openApp(b.dataset.app)));
$('#startbtn').onclick=()=>menu.style.display=menu.style.display==='block'?'none':'block';
function tick(){let d=new Date(),t=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});$('#clock').textContent=t;$('#widgettime').textContent=t;$('#date').textContent=d.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'});$('#cpu').style.width=(8+Math.random()*35)+'%';$('#ram').style.width=(25+Math.random()*30)+'%'}
tick();setInterval(tick,2000);
})();
</script>
</body>
</html>
